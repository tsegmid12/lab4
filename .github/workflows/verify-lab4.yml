name: Lab 4 Maven and mutation verification

on:
  push:
    branches: [main]
    paths:
      - "lab04-resubmission/**"
      - ".github/workflows/verify-lab4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run mutation test and final clean test
        shell: bash
        run: |
          set -euo pipefail
          cd lab04-resubmission
          mkdir -p ../results
          {
            echo "=== java -version ==="
            java -version 2>&1
            echo
            echo "=== mvn -version ==="
            mvn -version 2>&1
            echo
            echo "=== MUTATION: score >= 90.0 changed to score > 90.0 ==="
          } > ../results/mvn-test-mutant.txt
          cp src/main/java/mn/edu/must/sqat/GradeCalculator.java /tmp/GradeCalculator.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/mn/edu/must/sqat/GradeCalculator.java")
          s = p.read_text()
          old = "if (score >= 90.0)"
          new = "if (score > 90.0)"
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one >= 90.0 condition; mutation aborted.")
          p.write_text(s.replace(old, new))
          PY
          set +e
          mvn clean test >> ../results/mvn-test-mutant.txt 2>&1
          mutant_status=$?
          set -e
          cp /tmp/GradeCalculator.java src/main/java/mn/edu/must/sqat/GradeCalculator.java
          if [ "$mutant_status" -eq 0 ]; then
            echo "ERROR: mutation unexpectedly passed; expected BUILD FAILURE." | tee -a results/mvn-test-mutant.txt
            exit 1
          fi
          grep -q "BUILD FAILURE" results/mvn-test-mutant.txt
          grep -Eq "Failures: [1-9][0-9]*" results/mvn-test-mutant.txt
          {
            echo "=== FINAL SOURCE RESTORED: score >= 90.0 ==="
            echo "=== java -version ==="
            java -version 2>&1
            echo
            echo "=== mvn -version ==="
            mvn -version 2>&1
            echo
            echo "=== FINAL mvn clean test ==="
          } > ../results/mvn-test.txt
          mvn clean test >> ../results/mvn-test.txt 2>&1
          grep -q "BUILD SUCCESS" results/mvn-test.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path("../README.md")
          pass_log = Path("../results/mvn-test.txt").read_text(errors="replace")
          mutant_log = Path("../results/mvn-test-mutant.txt").read_text(errors="replace")
          def last_summary(s):
              matches = re.findall(r"Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)", s)
              if not matches:
                  raise SystemExit("Could not find Surefire 'Tests run:' summary.")
              return tuple(map(int, matches[-1]))
          total, failures, errors, skipped = last_summary(pass_log)
          mutant_total, mutant_failures, mutant_errors, mutant_skipped = last_summary(mutant_log)
          if failures or errors or "BUILD SUCCESS" not in pass_log:
              raise SystemExit("Final test run is not green.")
          if mutant_failures < 1 or "BUILD FAILURE" not in mutant_log:
              raise SystemExit("Mutation was not killed as expected.")
          java_line = next((x.strip() for x in pass_log.splitlines() if 'version "' in x), "Temurin 17 (see log)")
          maven_line = next((x.strip() for x in pass_log.splitlines() if x.startswith("Apache Maven ")), "See results/mvn-test.txt")
          section = f"""## Бодит туршилтын үр дүн (GitHub Actions)

          - Java: {java_line}
          - Maven: {maven_line}
          - Эцсийн зөв хувилбар: **BUILD SUCCESS**
          - Эцсийн тест: **{total}** (Failures: {failures}, Errors: {errors}, Skipped: {skipped})
          - Мутацийн хувилбар (>= 90 → > 90): **BUILD FAILURE**
          - Мутацийн тест: {mutant_total} (Failures: {mutant_failures}, Errors: {mutant_errors}, Skipped: {mutant_skipped})
          - Бодит командын гаралт: ../results/mvn-test.txt, ../results/mvn-test-mutant.txt

          ## Дүгнэлт

          1. letterGrade функц 0–100 завсрын оноог A, B, C, D, F үнэлгээнд ангилдаг.
          2. 90, 89.99, 60, 59.99, 0 болон 100 гэсэн заагийн утгуудыг тусгайлан шалгасан.
          3. Сөрөг, 100-аас их, NaN болон хязгааргүй оноонд IllegalArgumentException үүсэхийг тестэлсэн.
          4. totalScore нь ирц, лаборатори, хоёр сорил болон эцсийн шалгалтын тус бүрийн зөвшөөрөгдөх хязгаарыг шалгадаг.
          5. Хоёр @ParameterizedTest нь үсгэн үнэлгээ болон нийлбэр онооны олон оролтыг шалгадаг.
          6. >= 90 нөхцөлийг > 90 болгосон мутацид 90 онооны заагийн тест унаж, алдаатай нөхцөлийг илрүүлсэн.
          7. Эх кодыг >= 90 болгон сэргээсний дараах цэвэр тест BUILD SUCCESS болсон.
          """
          readme.write_text(readme.read_text().split("<!-- RESULTS:START -->")[0]
                            + "<!-- RESULTS:START -->\n" + section
                            + "<!-- RESULTS:END -->\n", encoding="utf-8")
          PY
      - name: Commit verified logs and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/mvn-test.txt results/mvn-test-mutant.txt README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Maven and mutation test evidence"
            git push
          fi
